# Dependabot, for the one supply chain this project has.
#
# There is no gomod ecosystem entry, because go.mod has no require block and
# there is nothing for Dependabot to bump. The Go toolchain itself is the
# dependency, and that is watched by govulncheck in ci.yml — which does
# reachability analysis rather than version comparison, and is what would have
# caught this project sitting on an end-of-life Go release for six months.
#
# What is here is the CI supply chain. Actions are pinned to commit SHAs so a
# moved tag cannot substitute code into the workflow that signs releases and
# pushes the container image; the cost of pinning is that nothing updates on
# its own, and this is what pays it. Dependabot rewrites both the SHA and the
# trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The build stage's base image. FROM golang:1.26-bookworm resolves to a
  # moving tag, so this is what notices when the pin should move.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
