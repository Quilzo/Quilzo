name: release

# The bill of materials is a release artefact rather than a document somebody
# maintains, and it is produced by the binary being released rather than from
# the source tree. debug.ReadBuildInfo reads what actually went into the
# artefact; asking the source describes what would be built now, and during an
# incident the question is what is deployed.
#
# The Cyber Resilience Act needs this to exist before a vulnerability report
# does, since a report has to say what is affected, and needs it retained for
# ten years — which a release asset does without anybody remembering to.

# Actions are pinned to commits, not tags.
#
# A tag is a mutable pointer in somebody else's repository. `actions/checkout@v4`
# is whatever v4 points at when the workflow runs, and the party who can move it
# is the action's owner or anybody who compromises them. This workflow signs
# release binaries and pushes the container image, so a substituted action is a
# supply-chain compromise of everything this project ships.
#
# That is the same argument the project makes about its own dependencies — the
# go.mod with no require block, the extension digests, the media addressed by
# hash. Leaving the CI supply chain on mutable tags while making that argument
# was an inconsistency, and it was the largest one the security review found
# after the toolchain.
#
# The version is kept in a trailing comment so a human can still read what this
# is, and Dependabot updates both together.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Needed to publish an attestation binding the artefacts to this workflow run.
  id-token: write
  attestations: write
  # Needed to push the container image to this repository's registry.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The full history, so the build stamps a real revision rather than a
          # shallow-clone placeholder that would make the SBOM name a commit
          # nobody can fetch.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"

      - name: The suite must pass before anything is built
        run: go test -count=1 ./...

      - name: Build
        run: |
          make build VERSION=${{ github.ref_name }}
          # Every platform a release carries. Cross-compiled with CGO off, so
          # these are genuinely static; the tree failed to build for macOS at
          # all until the first time anybody tried.
          make build-all VERSION=${{ github.ref_name }}

      - name: Bill of materials, from the binary
        run: |
          ./bin/quilzo compliance sbom bin/quilzo.cdx.json
          ./bin/quilzo compliance crypto --json > bin/quilzo.crypto.json

      - name: Refuse to ship a modified build
        run: |
          # A build from uncommitted changes describes source nobody else can
          # obtain, and an SBOM for it names a revision that does not exist.
          if grep -q '+modified' bin/quilzo.cdx.json; then
            echo "the working tree was dirty; this SBOM describes source nobody can fetch"
            exit 1
          fi

      - name: Refuse to ship undeclared dependencies
        run: |
          # The zero-dependency property is what makes the CRA obligations here
          # cheap. If it ever stops being true that should be a deliberate
          # decision, not something discovered during an incident.
          count=$(./bin/quilzo --json compliance summary | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['third_party_components'])")
          echo "third-party components: $count"
          test "$count" -eq 0

      - name: Checksums
        run: cd bin && sha256sum quilzo quilzo-* quilzo.cdx.json quilzo.crypto.json > SHA256SUMS

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            bin/quilzo
            bin/quilzo-*
            bin/quilzo.cdx.json

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            bin/quilzo
            bin/quilzo-linux-amd64
            bin/quilzo-linux-arm64
            bin/quilzo-darwin-amd64
            bin/quilzo-darwin-arm64
            bin/quilzo-windows-amd64.exe
            bin/quilzo-windows-arm64.exe
            bin/quilzo.cdx.json
            bin/quilzo.crypto.json
            bin/SHA256SUMS
          body: |
            Every artefact here carries its SHA-256 in `SHA256SUMS`, and the
            bill of materials was produced by this binary rather than from the
            source tree — so it describes what is in the file you downloaded.

            `quilzo.cdx.json` is CycloneDX 1.6.
            `quilzo.crypto.json` is the cryptographic inventory, including
            post-quantum status.

  # The image, published where somebody can actually pull it.
  #
  # A self-hosted CMS whose only installation route is "clone it and have a Go
  # toolchain" has no distribution. The Dockerfile has existed since the start
  # and nothing ever pushed what it built, so the image was real and
  # unobtainable — which is the same as not having one.
  #
  # Multi-arch, because arm64 is where a lot of self-hosting actually happens
  # and an amd64-only image is an image half the audience cannot run.
  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names for this image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The tag, the major.minor, and latest. Somebody pinning to a
          # version gets one that cannot move under them; somebody who wants
          # the current release gets latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      # The same provenance the binaries get. An image somebody pulls should be
      # traceable to the workflow run that built it, or the supply-chain
      # argument this project makes stops at the tarball.
      - name: Attest the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
