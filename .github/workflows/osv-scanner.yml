# OSV-Scanner: the coarse half of the supply-chain check.
#
# Kept, with its role stated, because "do we need this?" is a fair question for
# a project with no dependencies — and the answer turned out to be the most
# important finding of the security review.
#
# What it does here: compares the Go version in go.mod against the OSV database
# and reports every CVE filed against that release. With no require block, the
# standard library is the only thing it can look at, which sounds like nothing
# to check and is the opposite. It is how the project learned it had been
# pinned to Go 1.24 for months after that release reached end of life on
# 10 February 2026, shipping 29 known standard-library CVEs with no patch
# available.
#
# What it does NOT do: reachability. It reports CVEs filed against the release,
# not the ones this code can arrive at, so most of what it lists is noise for
# any given program. govulncheck in ci.yml is the precise half — it walks call
# graphs and reported 8 of those 29 as actually reachable, with traces. Both
# are kept because they fail differently: govulncheck goes quiet when a
# vulnerability is unreachable, and this one does not go quiet at all.
#
# Removed alongside this file's arrival: an APIsec workflow, which was the
# unmodified starter template scanning APIsec's own demo application with empty
# credentials. It could not have worked without a paid account and a publicly
# reachable endpoint, and pointing a third-party SaaS scanner at this API would
# contradict the property the project actually maintains — that it makes no
# outbound request an operator did not configure.

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '43 1 * * 5'
  push:
    branches: [ "main" ]

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78" # v1.7.1
    with:
      # Example of specifying custom arguments
      scan-args: |-
        -r
        --skip-git
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78" # v1.7.1
    with:
      # Example of specifying custom arguments
      scan-args: |-
        -r
        --skip-git
        ./
