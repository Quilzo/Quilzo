name: ci

# The security properties are the product. If the sandbox tests stop running,
# "templates cannot execute" is marketing.

on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand.
  #
  # Added because this workflow would not start on a pull request — the repo
  # allows Actions and the file is valid, so the block is above this
  # repository. Without a manual trigger there was no way to get the suite to
  # run at all on a branch, which meant a security fix sat unverified by CI
  # while looking perfectly normal on the pull request.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Formatting and vet
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt would change files:"; gofmt -l .; exit 1; }
          go vet ./...
      # Every platform the releases carry, cross-compiled.
      #
      # Windows was absent from releases for a year because the tree did not
      # compile for it — syscall.Flock is POSIX — and nothing said so, because
      # nothing built it. A platform that is unsupported by decision is fine;
      # one that is unsupported by accident is a bug nobody can see.
      - name: Every released platform still compiles
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            echo "--- $os/$arch"
            GOOS="$os" GOARCH="$arch" go vet ./... || exit 1
            GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cmd/quilzo || exit 1
          done
      - name: Sandbox escapes, XSS contexts, termination, tamper detection
        run: go test -count=1 ./...
      - name: The image must build and stay static
        run: docker build -t quilzo:ci .
