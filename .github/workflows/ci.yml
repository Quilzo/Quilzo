name: ci

# The security properties are the product. If the sandbox tests stop running,
# "templates cannot execute" is marketing.

# Actions are pinned to commits, not tags.
#
# A tag is a mutable pointer in somebody else's repository. `actions/checkout@v4`
# is whatever v4 points at when the workflow runs, and the party who can move it
# is the action's owner or anybody who compromises them. This workflow signs
# release binaries and pushes the container image, so a substituted action is a
# supply-chain compromise of everything this project ships.
#
# That is the same argument the project makes about its own dependencies — the
# go.mod with no require block, the extension digests, the media addressed by
# hash. Leaving the CI supply chain on mutable tags while making that argument
# was an inconsistency, and it was the largest one the security review found
# after the toolchain.
#
# The version is kept in a trailing comment so a human can still read what this
# is, and Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand.
  #
  # Added because this workflow would not start on a pull request — the repo
  # allows Actions and the file is valid, so the block is above this
  # repository. Without a manual trigger there was no way to get the suite to
  # run at all on a branch, which meant a security fix sat unverified by CI
  # while looking perfectly normal on the pull request.
  workflow_dispatch:

# Read-only by default, named rather than inherited.
#
# A workflow with no permissions block gets whatever the repository default is,
# which is a setting somebody can widen without touching this file. CodeQL
# flags it for that reason and it is right to: the least-privilege claim should
# live beside the thing it constrains.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, not a literal. The Go 1.24 EOL was missed here
          # because the version was written down in three workflows and one
          # go.mod, and updating go.mod left CI still building on an
          # unsupported toolchain. One place to change it, and it is the place
          # the build already reads.
          go-version-file: go.mod
      - name: Formatting and vet
        run: |
          # The toolchain's gofmt, not whatever is on PATH.
          #
          # Go 1.27 changed composite-literal indentation, so a local gofmt
          # from an older release reports a tree as clean that CI then
          # rejects — which is a failure that looks like CI being wrong and
          # is the local install being stale. `go run cmd/gofmt` is always
          # the gofmt belonging to the toolchain in go.mod.
          test -z "$(go run cmd/gofmt -l .)" || { echo "gofmt would change files:"; go run cmd/gofmt -l .; exit 1; }
          go vet ./...
      # Every platform the releases carry, cross-compiled.
      #
      # Windows was absent from releases for a year because the tree did not
      # compile for it — syscall.Flock is POSIX — and nothing said so, because
      # nothing built it. A platform that is unsupported by decision is fine;
      # one that is unsupported by accident is a bug nobody can see.
      - name: Every released platform still compiles
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            echo "--- $os/$arch"
            GOOS="$os" GOARCH="$arch" go vet ./... || exit 1
            GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cmd/quilzo || exit 1
          done
      # The published AgentDojo figure, checked against the gate on every push.
      #
      # The number is in the README, which means it can go stale silently: a
      # change to the agent policy that let an attack through would leave the
      # claim standing and nothing would say so. The harness needs no model, no
      # key and no network — that is the whole point of measuring the gate
      # rather than a model — so it runs here.
      #
      # The threshold is every replayable attack refused, because that is what
      # the README says. If a change makes that untrue, the honest response is
      # to change the number and say why, not to lower the bar here.
      - name: The published injection figure is still true
        run: |
          go build -o /tmp/quilzo ./cmd/quilzo
          python3 scripts/agentdojo/score.py --quilzo /tmp/quilzo --json > /tmp/score.json
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/score.json"))
          sec, use = r["security"], r["utility"]
          print(f"attacks refused {sec['refused']}/{sec['attacks']}, "
                f"tasks unattended {use['unattended']}/{use['tasks']}, "
                f"refused outright {len(use['refused'])}")
          if sec["attacks"] == 0:
              sys.exit("the harness replayed no attacks, so it measured nothing")
          if sec["refused"] != sec["attacks"]:
              sys.exit(f"{len(sec['permitted'])} attack(s) reached an action the "
                       f"README says they cannot: {sec['permitted']}")
          if use["refused"]:
              sys.exit(f"the policy now prevents work outright, which the README "
                       f"says it does not: {use['refused']}")
          EOF
      # The standard library is the only dependency this program has, which
      # makes the Go release it is built with the entire supply chain.
      #
      # govulncheck rather than a version comparison: it does reachability
      # analysis, so it reports the vulnerabilities this code can actually
      # arrive at rather than every CVE filed against the release. On 1.26.4
      # that was 8 reachable out of 29 reported, with call traces; on the
      # pinned 1.26.7 it is none. The difference is the difference between a
      # finding somebody acts on and a list somebody stops reading.
      #
      # This is the check that would have caught the real problem: the project
      # was pinned to Go 1.24, which reached end of life in February 2026, so
      # every release carried unpatched standard-library CVEs with no fix
      # available. Nothing was watching, because there were no dependencies to
      # watch and it looked like there was nothing to check.
      #
      # It is now the only supply-chain check. OSV-Scanner ran alongside it
      # until August 2026 and was removed for failing at startup after a
      # required action bump. Coverage was measured before deleting it rather
      # than assumed: go.mod was rolled back to the end-of-life 1.24 and
      # govulncheck alone reported 8 reachable standard-library
      # vulnerabilities and exited non-zero. The coarser scanner found that
      # problem first; it is not needed to keep finding it.
      - name: The one dependency has to be current
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Sandbox escapes, XSS contexts, termination, tamper detection
        run: go test -count=1 ./...
      - name: The image must build and stay static
        run: docker build -t quilzo:ci .

  # The race detector, on every pull request.
  #
  # The suite above runs without it, and until November 2026 nothing here
  # ran it at all, so a data race passed every pull request: a test that
  # drives two goroutines at the same field passes unless something is
  # watching for it. The store, the audit log, logd, the public site and the
  # agent executor share memory between goroutines, and a race there is a
  # torn audit record or a page served from half of two publishes, which no
  # assertion is written to look for.
  #
  # Over the packages that start goroutines, take locks, serve HTTP in their
  # tests or run tests in parallel, found from the source on every run rather
  # than listed here: a list is the thing a new concurrent package is missing
  # from. -race instruments every package a test binary links, so what those
  # packages call (MCP, webhooks, the schedule) is checked through them. The
  # whole suite runs raced and shuffled every night (nightly.yml); this is
  # the part worth a pull request's wait. workflows_test.go runs the search
  # and fails if it misses a package that starts a goroutine or imports sync.
  #
  # The timeout is the race detector's: it makes cmd/quilzo several times
  # slower, and go test's default of ten minutes a package would end the run
  # with a panic that reads like a hang.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: No data races in the concurrent packages
        run: |
          # go list failing fails the step, rather than racing fewer packages.
          set -o pipefail
          pkgs=$(go list -f '{{.ImportPath}} {{.Dir}}' ./... | while read -r pkg dir; do
            if grep -qE '(^|[;{])[[:space:]]*go [A-Za-z_(]|"sync"|"sync/atomic"|\.Parallel\(\)|httptest\.New(TLS|Unstarted)?Server|time\.AfterFunc|io\.Pipe\(' "$dir"/*.go; then
              echo "$pkg"
            fi
          done)
          # An empty list would test the repository's root package and pass.
          test -n "$pkgs" || { echo "found no concurrent packages, so the search is wrong"; exit 1; }
          echo "$pkgs"
          go test -race -count=1 -timeout=60m $pkgs

  # Thirty seconds of fuzzing for every fuzz target, on every pull request.
  #
  # The targets were written and then only ever run as unit tests: go test
  # without -fuzz replays the seed corpus and stops, so a parser that panics
  # on the first input nobody thought of passed for as long as nobody thought
  # of it. Several of them read bytes from outside before anybody has signed
  # in (OIDC tokens, SAML's XML signatures, client addresses), which is where
  # such input arrives first.
  #
  # The targets are found from the source each run, so one added later is
  # fuzzed without anybody editing this file; workflows_test.go fails if the
  # search misses one. One target at a time, because -fuzz takes one target
  # in one package. A failure prints the input it wrote under testdata/fuzz,
  # so it can be replayed from the log without the runner's disk.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every fuzz target survives thirty seconds
        run: |
          targets=$(grep -rE --include='*_test.go' --exclude-dir=testdata '^func Fuzz[A-Za-z0-9_]*\(' . |
            sed -E 's#^\./(.*)/[^/]*:func (Fuzz[A-Za-z0-9_]*)\(.*#\1 \2#' | sort -u)
          test -n "$targets" || { echo "found no fuzz targets, so the search is wrong"; exit 1; }
          failed=0
          while read -r dir name; do
            echo "--- $dir $name"
            if ! go test -run='^$' -fuzz="^${name}\$" -fuzztime=30s "./$dir"; then
              failed=1
              git ls-files --others --exclude-standard -- "$dir/testdata/fuzz/$name" | while read -r f; do
                echo "$f:"
                cat "$f"
              done
            fi
          done <<< "$targets"
          exit "$failed"
