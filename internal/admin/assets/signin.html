<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — scrivet</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main id="main">
<h1>Sign in</h1>
{{if .Error}}<p class="notice bad" role="alert">{{.Error}}</p>{{end}}
<p>Paste an API token. There is no password, and no puzzle to solve —
   WCAG 2.2 treats those as cognitive function tests.</p>
<form method="get" action="/">
  <div class="field">
    <label for="tok">API token</label>
    <input id="tok" name="token" type="password" autocomplete="current-password"
           aria-describedby="tok-help" required>
    <p id="tok-help" class="help">Starts with <code>scv_</code>. Create one with
      <code>scrivet token issue</code>.</p>
  </div>
  <button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
